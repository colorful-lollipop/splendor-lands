server {
    listen 80;
    listen 127.0.0.1:9443 ssl proxy_protocol;
    server_name splendor.zulogic.cn;

    access_log /www/sites/splendor.zulogic.cn/log/access.log main;
    error_log /www/sites/splendor.zulogic.cn/log/error.log;

    root /www/sites/splendor.zulogic.cn/index;
    index index.html;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    http2 on;
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/ssl/zulogic.cn/fullchain.pem;
    ssl_certificate_key /www/ssl/zulogic.cn/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /www/sites/splendor.zulogic.cn/proxy/*.conf;
}
